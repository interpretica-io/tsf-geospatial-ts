# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_geospatial drives the geospatial engine in the
# agent's RPC server, so this suite has a real agent with an RPC server,
# and GEOS, PROJ and GDAL live in that server, not in the tests.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external libraries. Their references live in conf/external.yml
# and the commits actually built in conf/builder.conf.lock. tsf-sql
# comes first: tapi_geospatial_postgis builds on its tapi_sql. The agent
# libraries (ta_*, rpcs_*) are listed again in the RPC server
# application below.
TE_EXT_REPO_USE([tsf_sql], [], [ta_sql rpcs_sql tapi_sql])
TE_EXT_REPO_USE([tsf_geospatial], [],
                [ta_geospatial rpcs_geospatial tapi_geospatial \
                 tapi_geospatial_postgis])

# The sql_* and geo_* RPCs. The platform is shared by engine and agent,
# so one declaration wires rpcxdr (engine) and rpcxdrta (agent) both.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_sql/sql_rpc.x.m4,../rpcs_geospatial/geospatial.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic engine restricted to the protocols needed; without this the
# meson build pulls the full default set, which includes SNMP and is
# unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application links the agent-side engines: ta_geospatial
# (GEOS, PROJ, GDAL, libcurl) and ta_sql (libpq for PostGIS, SQLite,
# MariaDB when present). The agent's C link takes system libraries only
# as pkg-config names through build.sh --extra-deps; GEOS ships geos.pc
# from 3.12 on.
TS_GEO_DEPS="libpcre2-8 geos proj gdal"
for ts_geo_dep in libcurl sqlite3 libpq libmariadb ; do
    if pkg-config --exists "${ts_geo_dep}" ; then
        TS_GEO_DEPS="${TS_GEO_DEPS} ${ts_geo_dep}"
    fi
done
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_geospatial rpcs_geospatial ta_sql rpcs_sql \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='${TS_GEO_DEPS}'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
